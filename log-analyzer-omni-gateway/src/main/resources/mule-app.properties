# ============================================================
# HTTP LISTENER (Omni Gateway)
# ============================================================
http.listener.host=0.0.0.0
http.listener.port=${mule.http.port:8081}

# ============================================================
# AGENT BACKEND (Python Log Analyzer)
# ============================================================
agent.host=${agent.host:localhost}
agent.port=${agent.port:5000}
agent.protocol=${agent.protocol:HTTP}
agent.url=${agent.protocol}://${agent.host}:${agent.port}
agent.timeout=${agent.timeout:30000}

# ============================================================
# OLLAMA CONFIGURATION
# ============================================================
ollama.url=${ollama.url:http://localhost:11434}
ollama.timeout=${ollama.timeout:60000}

# ============================================================
# SERVICENOW CONFIGURATION
# ============================================================
servicenow.instance=${servicenow.instance:}
servicenow.client.id=${servicenow.client.id:}
servicenow.client.secret=${servicenow.client.secret:}
servicenow.create.incidents=${servicenow.create.incidents:false}
servicenow.timeout=${servicenow.timeout:20000}

# ============================================================
# LOGGING
# ============================================================
logging.level=${logging.level:INFO}
logging.level.agent=${logging.level.agent:DEBUG}
