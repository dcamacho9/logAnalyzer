# ============================================================
# Development Environment Configuration
# ============================================================
# Configuración para desarrollo local

# ============================================================
# HTTP LISTENER
# ============================================================
http.listener.host=0.0.0.0
http.listener.port=8081

# ============================================================
# AGENT BACKEND
# ============================================================
# En desarrollo, el agente se ejecuta en localhost por defecto
# Para usar ngrok: export AGENT_HOST=valium-mauve-subheader.ngrok-free.dev y AGENT_PROTOCOL=HTTPS
agent.host=${AGENT_HOST:localhost}
agent.port=${AGENT_PORT:5000}
agent.protocol=${AGENT_PROTOCOL:HTTP}
agent.url=${agent.protocol}://${agent.host}:${agent.port}
agent.timeout=${AGENT_TIMEOUT:30000}

# ============================================================
# OLLAMA CONFIGURATION
# ============================================================
ollama.url=http://localhost:11434
ollama.timeout=60000

# ============================================================
# SERVICENOW CONFIGURATION
# ============================================================
servicenow.instance=dev123456.service-now.com
servicenow.client.id=dev_client_id
servicenow.client.secret=dev_client_secret
servicenow.create.incidents=false
servicenow.timeout=20000

# ============================================================
# LOGGING
# ============================================================
logging.level=DEBUG
logging.level.agent=DEBUG
