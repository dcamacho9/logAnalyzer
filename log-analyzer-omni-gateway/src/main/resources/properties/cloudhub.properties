# ============================================================
# CloudHub Environment Configuration
# ============================================================
# Este archivo contiene las configuraciones específicas para 
# desplegar en MuleSoft CloudHub

# ============================================================
# HTTP LISTENER
# ============================================================
# CloudHub proporciona el puerto automáticamente
http.listener.host=0.0.0.0
http.listener.port=${http.port:8081}

# ============================================================
# AGENT BACKEND (Python Log Analyzer Agent)
# ============================================================
# En CloudHub, el agente se ejecuta en un contenedor separado
# Opciones:
# 1. Si el agente está en CloudHub: usar el nombre del worker
# 2. Si el agente está on-premise: usar IP pública + vpn
# 3. Si el agente está en otra nube: usar URL pública

agent.host=${AGENT_HOST:log-analyzer-agent.cloudhub.io}
agent.port=${AGENT_PORT:5000}
agent.protocol=${AGENT_PROTOCOL:HTTPS}
agent.url=${agent.protocol}://${agent.host}:${agent.port}
agent.timeout=${AGENT_TIMEOUT:30000}

# ============================================================
# OLLAMA CONFIGURATION
# ============================================================
ollama.url=${OLLAMA_URL:http://ollama:11434}
ollama.timeout=${OLLAMA_TIMEOUT:60000}

# ============================================================
# SERVICENOW CONFIGURATION
# ============================================================
servicenow.instance=${SERVICENOW_INSTANCE:}
servicenow.client.id=${SERVICENOW_CLIENT_ID:}
servicenow.client.secret=${SERVICENOW_CLIENT_SECRET:}
servicenow.create.incidents=${SERVICENOW_CREATE_INCIDENTS:false}
servicenow.timeout=${SERVICENOW_TIMEOUT:20000}

# ============================================================
# LOGGING
# ============================================================
logging.level=${LOGGING_LEVEL:INFO}
logging.level.agent=${LOGGING_LEVEL_AGENT:INFO}

# ============================================================
# SECURE PROPERTIES
# ============================================================
# Las siguientes propiedades se cifran en CloudHub
# Configúralas en: CloudHub > Settings > Secure Properties
# - servicenow.client.secret (ya mapeado arriba)
