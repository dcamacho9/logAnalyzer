# ============================================================
# Production Environment Configuration
# ============================================================
# Configuración para producción

# ============================================================
# HTTP LISTENER
# ============================================================
http.listener.host=0.0.0.0
http.listener.port=${http.port:8081}

# ============================================================
# AGENT BACKEND
# ============================================================
# En producción, usa variables de entorno cifradas en CloudHub
# Para ngrok u otros HTTPS: AGENT_HOST=valium-mauve-subheader.ngrok-free.dev
agent.host=${AGENT_HOST:localhost}
agent.port=${AGENT_PORT:5000}
agent.protocol=${AGENT_PROTOCOL:HTTPS}
agent.url=${agent.protocol}://${agent.host}:${agent.port}
agent.timeout=${AGENT_TIMEOUT:30000}

# ============================================================
# OLLAMA CONFIGURATION
# ============================================================
ollama.url=${OLLAMA_URL}
ollama.timeout=${OLLAMA_TIMEOUT:60000}

# ============================================================
# SERVICENOW CONFIGURATION
# ============================================================
# IMPORTANTE: Todas estas variables deben estar en CloudHub
# como Secure Properties (cifradas)
servicenow.instance=${SERVICENOW_INSTANCE}
servicenow.client.id=${SERVICENOW_CLIENT_ID}
servicenow.client.secret=${SERVICENOW_CLIENT_SECRET}
servicenow.create.incidents=${SERVICENOW_CREATE_INCIDENTS:true}
servicenow.timeout=${SERVICENOW_TIMEOUT:20000}

# ============================================================
# LOGGING
# ============================================================
logging.level=WARN
logging.level.agent=INFO
