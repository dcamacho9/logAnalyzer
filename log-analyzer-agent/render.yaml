services:
  - type: web
    name: log-analyzer-agent
    env: python
    region: frankfurt  # O la región que prefieras (singapore, oregon, ohio)
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false  # Se definirá manualmente en la interfaz de Render
